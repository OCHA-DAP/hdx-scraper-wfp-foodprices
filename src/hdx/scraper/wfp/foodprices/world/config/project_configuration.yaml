# Collector specific configuration

commodities_headers:
  - commodity_id
  - category
  - commodity

currency_headers:
  - code
  - name

# This is where our definitions of admin levels differ so there is only admin 1
# data available in admin 2
unused_adm1:
  - "CIV"
  - "KEN"

# This is where our definitions of admin levels differ so there is only admin 2
# data available in admin 1
unused_adm2:
  - "DOM"
  - "RUS"
  - "UGA"

adm1_only:
  - "SLV"

# WFP admin names that AdminLevel matches wrongly or not at all. Admin 1 names
# for countries in unused_adm1 are WFP's admin 2 names.
admin1_config:
  admin_name_mappings:
    "BGD|Chittagong": "BD20"  # Chattogram
    "CMR|Ouest": "CM008"  # West, not East (CM003)
    "CMR|Sud-Ouest": "CM010"  # South-West
    "EGY|Minya": "EG24"  # Menia
    "IRQ|Dahuk": "IQG09"  # Duhok
    "KEN|Meru South": "KE013"  # Tharaka-Nithi
    "MOZ|Maputo City": "MZ11"  # Cidade de Maputo, not Maputo (MZ10)
    "NGA|Abuja": "NG015"  # Federal Capital Territory, not Abia (NG001)
    "SDN|Al Gezira": "SD15"  # Aj Jazirah
    "VEN|Distrito Federal": "VE01"  # Distrito Capital
    "VEN|Vargas": "VE24"  # Renamed La Guaira
    "YEM|Al Hudaydah": "YE18"  # Al Hodeidah, not Al Bayda (YE14)
  # Regions split, so the district decides the region: Brong Ahafo into Ahafo,
  # Bono and Bono East, Vatovavy Fitovinany into Vatovavy and Fitovinany
  admin_fuzzy_dont:
    - "GHA|brong ahafo"
    - "MDG|vatovavy fitovinany"

